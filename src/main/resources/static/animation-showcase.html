<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>修仙台 · 动画素材演示</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#10191b;color:#e9eadf}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:#172526;border-bottom:1px solid #55746b}h1{font-size:22px;font-weight:500;margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #729187;background:#263f3b;color:#e9eadf;padding:8px 14px;border-radius:3px;cursor:pointer}button:hover,button.on{background:#42665b}.grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:16px;padding:20px;max-width:1180px;margin:auto}.scene{position:relative;min-height:330px;overflow:hidden;border:1px solid #527169;background:#1c2c2d}.scene h2{position:absolute;z-index:5;left:18px;top:12px;font-size:17px;font-weight:400;margin:0;text-shadow:0 2px 8px #000}.hint{position:absolute;z-index:5;right:18px;top:15px;color:#b6c8bf;font-size:12px}.cloud{background:linear-gradient(#899f9c33,#1b2b2c99),url('/art/backgrounds/mountains-main.webp') center/cover}.cloud:before,.cloud:after{content:"";position:absolute;inset:0;background:url('/art/backgrounds/cloud-layer.webp') center/cover no-repeat;opacity:.62;animation:drift 18s ease-in-out infinite alternate}.cloud:after{opacity:.28;animation-duration:29s;animation-direction:alternate-reverse;transform:scale(1.12)}.cloud .mountain{position:absolute;inset:auto 0 0;height:52%;background:linear-gradient(transparent,#152425cc)}
.incense{background:radial-gradient(ellipse at 50% 82%,#8caa9630,transparent 44%),#1c2a2a}.incense img.body{position:absolute;width:280px;height:280px;object-fit:contain;left:50%;bottom:-18px;transform:translateX(-50%);z-index:2}.incense img.shadow{position:absolute;width:280px;height:280px;object-fit:contain;left:50%;bottom:-18px;transform:translateX(-50%);z-index:1;opacity:.8}.stick{position:absolute;z-index:3;left:50%;bottom:190px;width:3px;height:82px;background:#684e3e;transform:translateX(-50%)}.ember{position:absolute;z-index:4;left:50%;bottom:267px;width:14px;height:14px;border-radius:50%;background:#ffd59d;box-shadow:0 0 9px 5px #ff8e4a99;transform:translateX(-50%);animation:ember 1.3s ease-in-out infinite}.smoke{position:absolute;z-index:3;left:50%;bottom:270px;width:100px;height:170px;transform:translateX(-50%);opacity:.6}.smoke i{position:absolute;left:50%;bottom:0;width:42px;height:150px;border-left:3px solid #c9d5cd88;border-radius:50%;filter:blur(2px);animation:smoke 3.8s linear infinite}.smoke i:nth-child(2){height:120px;left:30%;animation-delay:-1.4s;opacity:.65}.smoke i:nth-child(3){height:140px;left:67%;animation-delay:-2.5s;opacity:.45}
.qi{background:radial-gradient(ellipse at center,#567c6d44,transparent 65%),#172626}.qi img{position:absolute;width:260px;height:260px;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.25;animation:qi 3.2s ease-in-out infinite}.qi .motes{position:absolute;inset:0;background:radial-gradient(circle at 30% 60%,#cce6c966 0 2px,transparent 3px),radial-gradient(circle at 66% 35%,#cce6c955 0 2px,transparent 3px),radial-gradient(circle at 72% 72%,#cce6c944 0 2px,transparent 3px);animation:motes 2.6s ease-in-out infinite alternate}
.trib{background:radial-gradient(ellipse at 50% 0,#485269,#0b1116 75%)}.trib img{position:absolute;width:min(80%,330px);height:min(80%,330px);left:50%;top:50%;transform:translate(-50%,-50%);opacity:.18;animation:thunder 1.5s ease-in-out infinite alternate}.bolt{position:absolute;top:0;height:85%;width:32%;stroke:#edf2ff;stroke-width:4;fill:none;filter:drop-shadow(0 0 9px #9eb5ff);animation:bolt .9s ease-out infinite}.bolt.b1{left:32%}.bolt.b2{right:25%;animation-delay:.45s}.flash{position:absolute;inset:0;background:#eef2ff;opacity:0;animation:flash 2s linear infinite}.stamp{background:#172426}.seal{position:absolute;left:50%;top:50%;width:130px;height:130px;border:3px solid #b55247;color:#c96559;display:grid;place-items:center;font:46px serif;transform:translate(-50%,-50%) rotate(-8deg);opacity:0;animation:stamp 2.8s ease-in-out infinite}.seal:after{content:"";position:absolute;inset:8px;border:1px solid #b55247}.note{padding:0 20px 20px;color:#a5b8ae;font-size:13px}.paused *{animation-play-state:paused!important}
@keyframes drift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}@keyframes ember{50%{transform:translateX(-50%) scale(1.25);opacity:1}}@keyframes smoke{from{transform:translateY(20px) scale(.7);opacity:0}35%{opacity:.8}to{transform:translateY(-90px) scale(1.2);opacity:0}}@keyframes qi{0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.12}50%{transform:translate(-50%,-50%) scale(1.1);opacity:.42}}@keyframes motes{to{transform:translateY(-14px) scale(1.12);opacity:.8}}@keyframes thunder{to{transform:translate(-50%,-50%) scale(1.08);opacity:.32}}@keyframes bolt{0%{stroke-dasharray:0 900;opacity:0}20%{stroke-dasharray:900 0;opacity:1}70%{opacity:.8}100%{opacity:0}}@keyframes flash{8%{opacity:.65}14%,100%{opacity:0}}@keyframes stamp{0%,48%{opacity:0;transform:translate(-50%,-50%) scale(1.7) rotate(-8deg)}58%{opacity:1;transform:translate(-50%,-50%) scale(.94) rotate(-8deg)}72%,90%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0}}
@media(max-width:700px){.grid{grid-template-columns:1fr;padding:12px}.scene{min-height:280px}header{padding:14px 16px;align-items:flex-start;gap:12px;flex-direction:column}}
</style></head>
<body><header><h1>修仙台 · 美术动画演示</h1><div class="controls"><button id="play" class="on">播放全部</button><button id="pause">暂停</button><button id="replay">重播</button></div></header>
<main class="grid"><section class="scene cloud"><h2>云海视差</h2><span class="hint">cloud-layer</span><div class="mountain"></div></section><section class="scene incense"><h2>香炉 · 香火烟气</h2><span class="hint">incense-body / smoke</span><img class="shadow" src="/art/incense/incense-shadow.webp"><img class="body" src="/art/incense/incense-body.webp"><i class="stick"></i><i class="ember"></i><div class="smoke"><i></i><i></i><i></i></div></section><section class="scene qi"><h2>灵气聚散</h2><span class="hint">qi-glow</span><img src="/art/ui/qi-glow.webp"><div class="motes"></div></section><section class="scene trib"><h2>雷劫过场</h2><span class="hint">thunder-motif</span><img src="/art/ui/thunder-motif.webp"><svg class="bolt b1" viewBox="0 0 120 600"><polyline points="70,0 52,150 76,160 40,320 70,330 30,520"/></svg><svg class="bolt b2" viewBox="0 0 120 600"><polyline points="50,0 66,120 44,132 78,280 50,292 86,460"/></svg><div class="flash"></div></section><section class="scene stamp"><h2>完成落印</h2><span class="hint">原有“毕”字动效</span><div class="seal">毕</div></section></main><p class="note">这是独立演示页，不会写入修炼记录。暂停只暂停动画，重播会重新触发雷光和落印。</p>
<script>const scenes=[...document.querySelectorAll('.scene')];const pause=()=>scenes.forEach(x=>x.classList.add('paused'));const play=()=>scenes.forEach(x=>x.classList.remove('paused'));document.querySelector('#play').onclick=play;document.querySelector('#pause').onclick=pause;document.querySelector('#replay').onclick=()=>{pause();void document.body.offsetWidth;play()};</script></body></html>
